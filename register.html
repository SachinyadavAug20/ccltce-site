<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign up — CCLTCE</title>
  <meta name="description" content="Create an account on the Coding Club at LTCOE portal." />
  <meta name="theme-color" content="#141414" />
  <meta name="color-scheme" content="dark" />
  <link rel="canonical" href="https://ccltce.github.io/register" />
  <link rel="preload" href="assets/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="assets/css/global.css?v=4" />
  <link rel="stylesheet" href="assets/css/nav.css" />
  <link rel="stylesheet" href="assets/css/brand.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
  <link rel="stylesheet" href="assets/css/footer.css" />
  <link rel="stylesheet" href="assets/css/gamify.css" />
  <link rel="stylesheet" href="assets/css/mobile.css" />
</head>
<body>

  <a class="skip" href="#main">Skip to content</a>

  <header class="nav-wrap"></header>

  <main id="main" class="auth-page">
    <section class="auth-card" aria-labelledby="register-title">
      <h1 id="register-title" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Sign up</h1>
      <h2>Join the club</h2>
      <p>Create an account with your email. You can form teams (up to 4 members) and register for events.</p>

      <form id="register-form" class="auth-form" novalidate>
        <label for="reg-name">Full name</label>
        <input id="reg-name" name="full_name" type="text" autocomplete="name" required maxlength="80" placeholder="Aakash Gupta" />

        <label for="reg-email">Email</label>
        <input id="reg-email" name="email" type="email" autocomplete="email" required placeholder="you@ltcoe.edu.in" />

        <label for="reg-password">Password</label>
        <input id="reg-password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />

        <label for="reg-confirm">Confirm password</label>
        <input id="reg-confirm" name="confirm" type="password" autocomplete="new-password" required placeholder="Repeat password" />

        <p class="form-error" id="register-error" hidden></p>

        <button class="btn btn-primary" type="submit">Create account</button>
      </form>

      <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <footer></footer>

  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/js/chrome.js"></script>
  <script defer src="assets/js/motion.js"></script>
  <script defer src="assets/js/clickfx.js"></script>

  <script defer src="assets/js/sfx.js"></script>
  <script defer src="assets/js/term-vfs.js"></script>
  <script defer src="assets/js/terminal.js"></script>
  <script defer src="assets/js/hud.js"></script>
  <script defer src="assets/js/eastereggs.js"></script>
  <script defer src="assets/js/voxel.js"></script>
  <script defer src="assets/js/physics.js"></script>
  <script defer src="assets/js/gamify.js"></script>
  <script defer src="assets/js/mobileTabs.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
