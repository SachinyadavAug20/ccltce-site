          </button>
          <button type="button" class="team-pill-btn" id="btn-mode-grid" role="tab" aria-selected="false" title="Classic Member Roster Grid">
            <svg class="pill-svg" viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M1 1h6v6H1zM9 1h6v6H9zM1 9h6v6H1zM9 9h6v6H9z"/></svg>
            <span>Roster Grid</span>
          </button>
        </div>

        <!-- Tree Canvas Controls (Fit Screen, Zoom, Pan Reset) -->
        <div class="team-canvas-tools" id="team-canvas-tools">
          <button type="button" class="team-tool-btn" id="btn-tree-fit" title="Fit entire hierarchy into screen (ideal for mobile)" aria-label="Fit tree to screen">

            <span>Fit Screen</span>
          </button>
          <button type="button" class="team-tool-btn" id="btn-tree-zoom-in" title="Zoom in" aria-label="Zoom in">
            <span>＋</span>
          </button>
          <button type="button" class="team-tool-btn" id="btn-tree-zoom-out" title="Zoom out" aria-label="Zoom out">
            <span>－</span>
          </button>
          <button type="button" class="team-tool-btn" id="btn-tree-reset" title="Reset to original 1:1 view" aria-label="Reset zoom">
            <span>↺ 1:1</span>
          </button>
        </div>
      </div>
      <p class="team-ctrl-hint" id="team-ctrl-hint">Tap any member to inspect bio &amp; stats • Drag canvas to pan</p>
