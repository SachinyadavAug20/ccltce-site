<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — LTCOE Coding Club</title>
  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/sections.css" />
</head>
<body>
  <header class="site-nav">
    <a class="brand" href="index.html">ccltce<span>_</span></a>
    <button id="menu-btn" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html" aria-current="page">Events</a></li>
      <li><a href="blogs.html">Blogs</a></li>
      <li><a href="team.html">Team</a></li>
    </ul>
  </header>

  <main>
    <section class="page-head">
      <h1>Upcoming Events</h1>
      <p>Workshops, contests and meetups. RSVP to reserve your spot — registration closes 24h before each event.</p>
    </section>

    <div class="tabs" data-tabs>
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="workshop">Workshops</button>
      <button class="tab" data-filter="contest">Contests</button>
    </div>

    <div class="grid cols-2" data-events></div>

    <dialog class="dialog" id="rsvp">
      <h3 style="margin-bottom:.5rem">RSVP</h3>
      <p style="color:var(--muted);font-size:.9rem"></p>
      <form method="dialog" style="display:flex;gap:.6rem;margin-top:1rem">
        <button class="btn primary" style="flex:1">Confirm</button>
        <button class="btn" id="rsvp-close">Cancel</button>
      </form>
    </dialog>
  </main>
  <footer class="site-foot">
    <a class="brand" href="index.html">ccltce<span>_</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="blogs.html">Blogs</a>
      <a href="team.html">Team</a>
    </nav>
    <p class="note">// LTCOE Coding Club, 2026 — zero frameworks, one repo.</p>
  </footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
